<meta charset="utf-8">
<title>Label Maker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  :root{--bg:#F3F5F8;--panel:#fff;--line:#E1E6EE;--ink:#1B2433;--muted:#667085;--accent:#163F73;--accent2:#2F78C4;--warn:#D9480F;--ok:#2E7D4F;--sel:#2F78C4}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",GPInter,system-ui,sans-serif}
  #app{display:grid;grid-template-columns:410px 1fr;grid-template-rows:54px 1fr;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
  header .brand{font-weight:700;color:var(--accent);font-size:15px;margin-right:6px;white-space:nowrap}
  header .sp{flex:1}
  .tabs{display:inline-flex;background:#EEF1F5;border-radius:9px;padding:3px;gap:3px}
  .tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
  .stabs{display:flex;border-bottom:1px solid var(--line)}
  .stabs button{flex:1;border:0;border-radius:0;background:#fff;padding:10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
  .stabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .pane{flex:1;overflow:auto;padding:4px 0 30px}
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0;overflow:hidden}
  #wrap{position:relative}
  #preview{display:block;background:#fff;box-shadow:0 6px 24px rgba(16,24,40,.14);border-radius:6px}
  #overlay{position:absolute;left:0;top:0;cursor:default;touch-action:none}
  #hintbar{position:absolute;left:18px;bottom:6px;color:var(--muted);font-size:12px}
  footer{background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
  footer .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  footer .grp label{color:var(--muted)}
  footer select{width:auto;min-width:56px}
  details{border-bottom:1px solid var(--line)}
  details>summary{list-style:none;cursor:pointer;padding:11px 16px;font-weight:650;color:var(--accent);display:flex;align-items:center;gap:8px;user-select:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details[open]>summary::before{transform:rotate(90deg)}
  .sec{padding:2px 16px 14px}
  .row{display:flex;gap:8px;align-items:center;margin:6px 0}
  .row>label{width:118px;flex:none;color:var(--muted)}
  .row>.grow{flex:1;min-width:0}
  input[type=text],input[type=number],textarea,select{width:100%;font:inherit;padding:6px 8px;border:1px solid #CBD3DF;border-radius:6px;background:#fff;color:var(--ink)}
  header select{width:auto;min-width:200px}
  textarea{resize:vertical;min-height:56px}
  input:focus,textarea:focus,select:focus{outline:2px solid #9CC0EA;border-color:var(--accent2)}
  .hint{color:var(--muted);font-size:11.5px;margin:2px 0 6px}
  .hint b{color:var(--ink)}
  button{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid #CBD3DF;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  button:hover{background:#F2F5F9}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:#0F2F57}
  button.small{padding:3px 8px;font-size:12px}
  button.icon{padding:3px 7px;line-height:1}
  .sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sw button{display:flex;align-items:center;gap:6px;padding:5px 9px}
  .sw i{display:inline-block;width:14px;height:14px;border-radius:50%}
  input[type=color]{width:42px;height:30px;padding:0 2px;border:1px solid #CBD3DF;border-radius:6px;background:#fff;flex:none}
  table.nut{width:100%;border-collapse:collapse;margin-top:4px}
  table.nut th{font-weight:600;color:var(--muted);font-size:11.5px;text-align:left;padding:2px 3px}
  table.nut td{padding:2px 3px;vertical-align:middle}
  table.nut input[type=text]{padding:4px 5px}
  table.nut .c{text-align:center}
  .status{font-size:12px;margin-top:3px}
  .status.ok{color:var(--ok)} .status.bad{color:var(--warn)}
  .imgrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .thumb{width:44px;height:30px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#fafafa}
  .seg{display:inline-flex;border:1px solid #CBD3DF;border-radius:7px;overflow:hidden}
  .seg button{border:0;border-radius:0;border-right:1px solid #CBD3DF;padding:5px 10px}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  /* layers */
  .props{position:sticky;top:0;z-index:2;box-shadow:0 4px 10px rgba(16,24,40,.06);margin:10px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#FAFBFC}
  .props h4{margin:0 0 8px;font-size:13px;color:var(--accent);display:flex;align-items:center;gap:8px}
  .props .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .props .grid label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  .props .grid input{padding:5px 6px}
  .props .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .props .empty{color:var(--muted);font-size:12.5px}
  .lgroup{margin:4px 0 8px}
  .lgroup .gh{padding:6px 16px;font-weight:650;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .lrow{display:flex;align-items:center;gap:8px;padding:5px 16px 5px 22px;cursor:pointer;border-left:3px solid transparent}
  .lrow:hover{background:#F4F7FB}
  .lrow.sel{background:#EAF2FC;border-left-color:var(--sel)}
  .lrow .nm{flex:1}
  .lrow.off .nm{color:#98A2B3;text-decoration:line-through}
  .lrow .mv{color:#98A2B3;font-size:11px}
  .lrow input{margin:0}
  #toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1B2433;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;font-size:13px;max-width:80vw;text-align:center;z-index:5}
  #toast.show{opacity:.95}
  #busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;font-weight:600;color:var(--accent);font-size:15px;z-index:6}
  #busy.show{display:flex}
  .warnbox{background:#FFF4EC;border:1px solid #F7C9A9;color:#8A3A0F;border-radius:6px;padding:6px 9px;font-size:12px;margin:8px 16px;display:none}
</style>
<style id="shopmate-labels">
  #bBackApp{font-weight:700}
  #bAiFill{background:linear-gradient(135deg,#F2B33D,#E08A1E);color:#fff;border:0;font-weight:700}
  .lm-modal{position:fixed;inset:0;background:rgba(20,16,8,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
  .lm-box{background:#fff;color:#222;border-radius:16px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .lm-box h3{margin:0 0 8px;font-size:17px}
  .lm-hint{color:#666;font-size:12.5px;margin:6px 0}
  .lm-l{display:block;font-weight:600;margin:10px 0 4px}
  .lm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
  .lm-grid label{display:flex;gap:6px;align-items:center}
  .lm-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .lm-btns .pri{background:#E08A1E;color:#fff;border-color:#E08A1E;font-weight:700}
  @media (max-width:820px){
    #app{display:flex;flex-direction:column;height:auto;min-height:100vh}
    header{flex-wrap:wrap;height:auto;padding:8px 10px;gap:6px}
    header .brand{display:none}
    header select{min-width:0;flex:1 1 160px}
    header .sp{display:none}
    main{order:1;min-height:0}
    #stage{height:52vh;min-height:260px}
    aside{order:2;border-right:0;border-top:1px solid var(--line)}
    aside .pane{max-height:none;overflow:visible}
    footer{padding:10px}
    #hintbar{display:none}
    button,select,input{min-height:36px}
  }
  .lm-panel{position:fixed;right:16px;bottom:16px;width:min(400px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#fff;color:#222;border-radius:16px;padding:16px;box-shadow:0 16px 50px rgba(0,0,0,.28);z-index:9998}
  .lm-panel h3{margin:0 24px 6px 0;font-size:16px}
  .lm-x{position:absolute;top:10px;right:10px;border:0;background:#f2f2f2;border-radius:50%;width:28px;height:28px;min-height:0;padding:0}
  .lm-idea{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #eee}
  .lm-idea>div{flex:1}.lm-idea button.on{background:#E08A1E;color:#fff;border-color:#E08A1E}
  .lm-sw{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #ccc}
  .lm-err{color:#b3261e;font-weight:600}
  #bAiDesign,#bAiPhoto{background:#fff6e8;border-color:#f0c27a;color:#8a4b00;font-weight:700}
  @media (max-width:1560px){header .brand{display:none}}
  @media (min-width:821px){header{overflow-x:auto}header>*{flex:none}}
  .lm-panel,.lm-panel *,.lm-box,.lm-box *{box-sizing:border-box}
  .lm-panel input,.lm-panel textarea,.lm-panel select,.lm-box input,.lm-box textarea,.lm-box select{max-width:100%}
  .lm-panel p,.lm-panel div,.lm-box p{overflow-wrap:anywhere}
  @media (max-width:820px){
    html,body{overflow-x:hidden;max-width:100vw}
    #app{max-width:100vw;overflow-x:hidden}
    .lm-panel{position:fixed;left:0;right:0;bottom:0;width:100vw;max-width:100vw;max-height:50vh;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
    .lm-panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#ddd;margin:-4px auto 8px}
    .lm-idea{flex-wrap:nowrap}.lm-idea>div{min-width:0}
    .lm-box{width:100%;max-width:calc(100vw - 24px)}
    footer input,footer select,header select{max-width:100%}
  }
  #stage{position:relative}
  #bEditMode{position:absolute;top:10px;right:10px;z-index:5;font-weight:700;border-radius:999px;padding:6px 14px;background:#fff;border:1px solid #d9cdb4;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  body.lm-editing #bEditMode{background:#E08A1E;color:#fff;border-color:#E08A1E}
  body:not(.lm-editing) #overlay{pointer-events:none;touch-action:auto;cursor:default}
  body.lm-editing #wrap{outline:2px dashed #E08A1E;outline-offset:6px;border-radius:8px}
  .lm-seg{display:flex;background:#f3efe6;border-radius:10px;padding:3px;gap:3px;margin:4px 0 6px}
  .lm-seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-weight:600;min-height:0}
  .lm-seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:#8a4b00}
  .lm-btns{flex-wrap:wrap}
  .lm-btns button{flex:1 1 auto;min-width:0;white-space:normal}
  @media (max-width:520px){.lm-box .lm-btns{flex-direction:column-reverse}.lm-box .lm-btns button{width:100%}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Label Maker</div>
    <div class="tabs" id="themeTabs"></div>
    <select id="prodSel" title="Your saved products"></select>
    <button id="bSave" title="Save the changes to this product">Save</button>
    <button id="bSaveAs" title="Save as a new product">Save as new…</button>
    <button id="bDel" title="Delete this product">Delete</button>
    <span class="sp"></span>
    <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
    <button id="bExport" title="Save all products to a backup file">Backup…</button>
    <button id="bImport" title="Load products from a backup file">Restore…</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </header>

  <aside>
    <div class="stabs"><button id="tabContent" class="on">Content</button><button id="tabLayers">Layers</button></div>
    <div class="pane" id="form"></div>
    <div class="pane" id="layersPane" style="display:none"></div>
  </aside>

  <main>
    <div id="stage"><div id="wrap"><canvas id="preview"></canvas><canvas id="overlay"></canvas></div>
      <div id="hintbar">Click anything on the label to select it · drag to move · drag a corner to resize · arrow keys nudge · Delete hides</div></div>
    <footer>
      <div class="grp">
        <button id="bPng">Save label picture (PNG)</button>
        <button id="bPdf1">Save label PDF</button>
      </div>
      <div class="grp">
        <label>Label sheet:</label><select id="pSheet" title="The label sheet you print on – the design fits itself to the label size"></select>
      </div>
      <div class="grp">
        <label>Print:</label>
        <label>labels</label><select id="pCount"></select>
        <label>start at no.</label><select id="pStart"></select>
        <label>adjust mm →</label><input id="pDx" type="number" step="0.1" value="0" style="width:62px">
        <label>↓</label><input id="pDy" type="number" step="0.1" value="0" style="width:62px">
        <button id="bSheet" class="primary">Save print sheet PDF</button>
        <button id="bTest" title="Outlines only – print on plain paper to check alignment">Alignment test</button>
      </div>
    </footer>
  </main>
</div>
<div id="toast"></div>
<div id="busy">Working…</div>

/* ---------------- drawing with user changes ---------------- */
function ov(id) { return Object.assign({ dx: 0, dy: 0, sx: 1, sy: 1, hidden: false }, S.lay[id] || {}); }
function anchorOff(l) {
  if (l.anchor === 'bg') return [0, 0];
  if (l.anchor === 'bottomFull') return [0, EY];
  if (l.anchor === 'bottom') return [EX / 2, EY];
  if (l.anchor === 'left') return [0, EY / 2];
  if (l.anchor === 'leftBottom') return [0, EY];
  return [EX / 2, EY / 2];
}
function layerBounds(l) {
  const b = l.bounds(); if (!b) return null; const o = ov(l.id); const [ax, ay] = anchorOff(l);
  const base = { x: b.x + ax, y: b.y + ay, w: b.w, h: b.h };
  return { x: base.x + o.dx, y: base.y + o.dy, w: b.w * o.sx, h: b.h * o.sy, base };
}
function drawLabel(ctx, k, opt = {}) {
  const env = { preview: !!opt.preview, missing: [] };
  ctx.save(); ctx.textBaseline = 'alphabetic';
  for (const l of LAYERS) {
    const o = ov(l.id); if (o.hidden) continue;
    const b = l.bounds(); const [ax, ay] = anchorOff(l);
    ctx.save();
    if (b && (o.dx || o.dy || o.sx !== 1 || o.sy !== 1)) {
      ctx.translate((b.x + ax + o.dx) * k, (b.y + ay + o.dy) * k); ctx.scale(o.sx, o.sy); ctx.translate(-b.x * k, -b.y * k);
    } else if (ax || ay) ctx.translate(ax * k, ay * k);
    l.draw(ctx, k, env);
    ctx.restore();
  }
  ctx.restore();
  return env;
}

/* ==================== tiny PDF writer (JPEG pages) ==================== */
function makePdf(pages) {
  const enc = new TextEncoder();
  const chunks = []; let len = 0; const offs = [];
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };

function pickImage(cb, cancel, bw) {

        const im2 = await loadImage(data); const c = document.createElement('canvas'); c.width = im2.naturalWidth; c.height = im2.naturalHeight;

}

<script>
/* ShopMate AI: "Totally new layout". The AI moves and resizes every block of the label on a new background.

(function () {
  const BLOCKS = {
    doogh: { logo: ["logo"], name: ["name", "tagBg", "tagText"], persian: ["persian"], cow: ["cow"], nutrition: ["nipBox", "nipTitle", "nipServ", "nipHead", "nipTable", "ingr", "containsBg", "containsText"],
      size: ["size", "sizeLine"], bestBefore: ["bbBox", "bbText"], storage: ["storeIcon", "storage"], barcode: ["barcodeBg", "barcode"], claims: ["claim1", "claim2", "claim3", "claim4"], maker: ["maker"] },
    icecream: { logo: ["logo"], cow: ["cow"], claims: ["claim1", "claim2", "claim3", "claim4"], name: ["name", "nameSub"], persian: ["persian"], size: ["size"], divider: ["divider"],
      nutrition: ["nipBox", "nipTitle", "nipServ", "nipHead", "nipTable"], ingredients: ["ingr", "containsBg", "containsText"], storage: ["storeIcon", "storage"], bestBefore: ["bbBox", "bbText"], maker: ["maker"], barcode: ["barcodeBg", "barcode"] }
  };
  const DESC = { logo: "the business logo", name: "product name heading" , persian: "Persian name", cow: "cow mascot picture", nutrition: "nutrition information panel (with ingredients on Doogh)", ingredients: "ingredients and allergen statement",
    size: "pack size (e.g. 375 mL)", bestBefore: "best before & batch box", storage: "storage instruction line with snowflake", barcode: "barcode area", claims: "row/list of short claims with icons", maker: "made-by line with address and ABN (legal, keep readable)", divider: "thin divider line" };
  const BOXED = new Set(["nutrition", "bestBefore", "barcode"]);
  const REQUIRED = new Set(["logo", "name", "size", "nutrition", "ingredients", "bestBefore", "maker", "storage"]);
  const BG_IDS = new Set(["bg", "glow", "band", "bandWave", "panel", "panelEdge"]);
  const STYLES = ["plain", "left", "right", "top", "bottom", "diagonal", "frame", "circle", "topbottom", "wave"];
  window.LM_BLOCKS = BLOCKS;

  const blocksNow = () => BLOCKS[S.theme] || BLOCKS.doogh;
  function blockOf(id) { const B = blocksNow(); for (const k in B) if (B[k].includes(id)) return k; return null; }
  function hexOk(v) { return /^#[0-9a-f]{6}$/i.test(String(v || "")); }
  function lum(h) { const n = parseInt(h.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255; const f = c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); }

  /* ---------- background geometry (label mm) ---------- */
  function bgShape(k) {
    const f = S.free, b = f.bg, W = LABEL.w, H = LABEL.h, s = Math.max(6, Math.min(b.size || 30, Math.max(W, H))), p = new Path2D(), K = v => v * k;
    switch (b.style) {
      case "left": p.rect(0, 0, K(s), K(H)); break;
      case "right": p.rect(K(W - s), 0, K(s), K(H)); break;
      case "top": p.rect(0, 0, K(W), K(Math.min(s, H))); break;
      case "bottom": p.rect(0, K(H - Math.min(s, H)), K(W), K(Math.min(s, H))); break;
      case "topbottom": { const h = Math.min(s, H) / 2; p.rect(0, 0, K(W), K(h)); p.rect(0, K(H - h), K(W), K(h)); break; }
      case "diagonal": p.moveTo(0, 0); p.lineTo(K(s + H * .35), 0); p.lineTo(K(s), K(H)); p.lineTo(0, K(H)); p.closePath(); break;
      case "frame": { const t = Math.max(2, s / 6); p.rect(0, 0, K(W), K(H)); p.rect(K(t), K(t), K(W - 2 * t), K(H - 2 * t)); break; }
      case "circle": p.arc(K(W - s * .25), K(H / 2), K(s / 2), 0, Math.PI * 2); break;
      case "wave": { const h = Math.min(s, H); p.moveTo(0, K(H)); p.lineTo(0, K(H - h)); for (let x = 0; x <= W; x += 1) p.lineTo(K(x), K(H - h + Math.sin(x / W * Math.PI * 3) * 1.6)); p.lineTo(K(W), K(H)); p.closePath(); break; }

  }
  const HIT = document.createElement("canvas").getContext("2d");
  function inColour(x, y) { if (!S.free || S.free.bg.style === "plain") return false; const p = bgShape(1); return S.free.bg.style === "frame" ? HIT.isPointInPath(p, x, y, "evenodd") : HIT.isPointInPath(p, x, y); }
  function blockBox(key, list) {

    return bs.length ? unionB(bs) : null;
  }
  function colourFrac(x, y, w, h) { if (!S.free || S.free.bg.style === "plain") return 0; let n = 0, t = 0; for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) { t++; if (inColour(x + w * (i + .5) / 6, y + h * (j + .5) / 4)) n++; } return n / t; }

  /* ---------- layers in a free layout ---------- */
  const bgLayer = {
    id: "freeBg", name: "New background", group: "Background", kind: "shape", locked: true, anchor: "bg",
    bounds() { return { x: 0, y: 0, w: LABEL.w, h: LABEL.h }; },
    draw(ctx, k) {

  };

  /* ---------- applying an AI layout ---------- */
  function applyLayout(x, base) {
    S = JSON.parse(base);

    if (hexOk(x.textColour) && lum(x.textColour) < .25) S.textColour = x.textColour;
    if (["poppins", "inter"].includes(x.headFont)) S.headFont = x.headFont;
    S.ink = "full";
    S.lay = {};

    // place blocks: biggest first, nudged off each other if they collide
    const B = blocksNow(), want = x.blocks || {}, placed = [], m = 1.5;
    const keys = Object.keys(B).sort((a, b) => { const A = blockBox(a), C = blockBox(b); return (C ? C.w * C.h : 0) - (A ? A.w * A.h : 0); });

      const given = want[key], w = given || {}, box = blockBox(key); if (!box) continue;
      if ((w.hidden || !given) && !REQUIRED.has(key)) { B[key].forEach(id => S.lay[id] = Object.assign(ov(id), { hidden: true })); continue; }
      let sc = Number(w.scale); if (!(sc > 0)) sc = 1; sc = Math.max(REQUIRED.has(key) ? .8 : .5, Math.min(sc, 1.8));

      const g = .8, boxed = BOXED.has(key);

        for (let r = .5; r < 70 && best[2] > 0; r += .5) for (let a = 0; a < 24; a++) { const X = clampX(tx + Math.cos(a / 12 * Math.PI) * r), Y = clampY(ty + Math.sin(a / 12 * Math.PI) * r * .65), h = hits(X, Y); if (h < best[2] - 1e-6) best = [X, Y, h]; }

  function leaveFree() { pushUndo(); S.free = null; S.lay = {}; afterLoad(); markDirty(); toast("Back to your template design"); }
  window.__lmLeaveFree = leaveFree;

  /* ---------- the prompt ---------- */
  window.__lmLayoutPrompt = function (wish) {

    return { sys, text };
  };
  window.__lmFreeOn = () => !!S.free;
})();
