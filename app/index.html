<style>
/* Layout: one-column phone app — summary strip, filterable invoice list, slide-up sheets for editing and sending, fixed bottom tab bar. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#EAEDE6; --ink:#1B2230; --muted:#5D6573; --line:#DDE1D8;
  --gold:#E3A21A; --gold-soft:#FBEBC4; --gold-ink:#5E4100; --cow:#E9782B;
  --ok:#22865A; --ok-soft:#DDF1E6; --warn:#B7790B; --warn-soft:#FCEFD2; --bad:#C2412F; --bad-soft:#FBE1DC;
  --plain:#2F6FB3; --mint:#2E9B6B;
  --shadow:0 1px 2px rgba(27,34,48,.06),0 6px 20px rgba(27,34,48,.06);
  --f-display:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11141A; --surface:#1A1F28; --sunk:#232935; --ink:#EEF0F3; --muted:#9BA3B1; --line:#2B3240;
  --gold:#F0B53A; --gold-soft:#3A2E12; --gold-ink:#F8D98E; --cow:#F28D45;
  --ok:#4CC08A; --ok-soft:#163327; --warn:#E9B23F; --warn-soft:#382B10; --bad:#F07562; --bad-soft:#3B1B17;
  --plain:#6FA4E0; --mint:#5CC898; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 190px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.mark{width:44px;height:44px;border-radius:12px;flex:none;overflow:hidden;box-shadow:var(--shadow)}
.top h1{font-size:21px;font-weight:800;line-height:1.1}
.top p{margin:0;color:var(--muted);font-size:13px}
.top .grow{flex:1;min-width:0}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.bad{background:var(--bad-soft)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted)}
.stat.bad .v{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:0;text-align:left;width:100%}
.row:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;flex:none}
.row .amt b{font-family:var(--f-display);font-size:17px;display:block}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-paid{background:var(--ok-soft);color:var(--ok)}.p-over{background:var(--bad-soft);color:var(--bad)}
.p-due{background:var(--warn-soft);color:var(--warn)}.p-draft{background:var(--sunk);color:var(--muted)}
.p-sample{background:var(--gold-soft);color:var(--gold-ink)}
.empty{text-align:center;color:var(--muted);padding:36px 12px;background:var(--surface);border-radius:16px;border:1px dashed var(--line)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:4px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px;gap:8px}
.sec h2{font-size:17px}
.sec small{color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;width:100%}
.tab{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--gold)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--gold);color:#1B2230;border:0;border-radius:999px;padding:14px 20px;font-family:var(--f-display);font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(227,162,26,.35);cursor:pointer;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-align:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1B2230}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:default;pointer-events:none}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card h3{font-size:16px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.ftlist{display:flex;flex-direction:column;gap:6px}.ftrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}.ftrow input{width:22px;height:22px;flex:none;accent-color:var(--gold)}.ftrow .ftem{font-size:20px;flex:none}.ftrow b{display:block}.ftrow small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.jphotos{display:flex;flex-wrap:wrap;gap:8px}.jph{position:relative}.jph img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;cursor:pointer}.jphx{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px}.jthumb{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none}.jatt{display:grid;grid-template-columns:1fr 1fr;gap:6px}.jatt button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}.jatt button[aria-pressed=true]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}.jcrew input{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}.jview{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}.jview-in{color:#fff;text-align:center;max-width:100%}.jview-in img{max-width:100%;max-height:85vh;border-radius:8px}.jview-x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;min-height:40px}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h2{flex:1;font-size:18px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;font-size:20px;line-height:1}
.sheet-b{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-b>.in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.sheet-f .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.sheet-f .btn{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:0;max-width:100%}
.pick button b{font-size:13.5px}
.pick button span{font-size:12px;color:var(--muted)}
.pick button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .nm{border:0;background:transparent;font-weight:700;padding:4px 0;min-width:0;width:100%;font-size:16px}
.line .ctrls{display:flex;align-items:center;gap:8px;grid-column:1/-1;flex-wrap:wrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:40px;height:40px;border:0;background:var(--sunk);cursor:pointer;font-size:18px;font-weight:700}
.step input{width:52px;height:40px;border:0;text-align:center;background:var(--surface);font-size:16px}
.price{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding-left:8px;background:var(--surface)}
.price input{width:80px;height:40px;border:0;background:transparent;padding:0 6px;font-size:16px}
.line .tot{font-family:var(--f-display);font-weight:700;margin-left:auto}
.totals{display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:2px solid var(--ink)}
.totals div{display:flex;justify-content:space-between}
.totals .big{font-family:var(--f-display);font-size:22px;font-weight:800}
.paper{background:#fff;color:#1B2230;border-radius:6px;box-shadow:var(--shadow);overflow:hidden;font-size:12.5px}
.paper .ph{background:#E3A21A;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid #E9782B}
.paper .ph b{font-family:var(--f-display);font-size:18px}
.paper .pb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{padding:5px 0;text-align:left;border-bottom:1px solid #E6E6E0}
.paper th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#5D6573}
.paper .r{text-align:right}
.paper .box{background:#F6F3EA;border-radius:6px;padding:8px 10px}
.paper .spec{background:#FFF4D6;border-left:3px solid #E9782B;padding:8px 10px;border-radius:0 6px 6px 0}
.paper .muted{color:#5D6573}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions .btn{flex-direction:column;gap:2px;min-height:62px;font-size:13.5px}
.actions .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.actions .wide{grid-column:1/-1;flex-direction:row;min-height:52px}
.hist{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
.msgbox{width:100%;min-height:150px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.prod{display:grid;grid-template-columns:1fr 92px auto auto;gap:6px;align-items:center}
.prod input[type=text],.prod input[type=number],.spec-ed input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;width:100%;min-width:0;font-size:16px}
.prod label{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);flex:none}
.spec-ed{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}
.spec-ed .hd{display:flex;gap:6px}
.step-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
@media (max-width:380px){.summary .stat .v{font-size:16px}.prod{grid-template-columns:1fr 78px auto auto}}
.aitxt{font-size:14.5px;line-height:1.45}.aitxt p{margin:0 0 2px}.aitxt .aih{font-weight:700;margin-top:4px}.aitxt .aigap{height:8px}.aitxt ul.aimd,.aitxt ol.aimd{margin:2px 0 4px;padding-left:20px}.aitxt li{margin:2px 0}
.aiacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.aiacts .btn{width:auto;flex:none}
#ptr{position:fixed;top:-46px;left:50%;transform:translate(-50%,0);opacity:0;z-index:60;display:flex;gap:8px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:14px;font-weight:600;pointer-events:none}
#ptr .ptr-ic{display:inline-block;font-size:18px;color:var(--gold)}#ptr.spin .ptr-ic{animation:ptrspin .8s linear infinite}@keyframes ptrspin{to{transform:rotate(360deg)}}
#sheet.ro .sheet-f .btn.pri,#sheet.ro .btn.danger,#sheet.ro [data-act="fDel"]{display:none!important}
#memBar{margin-bottom:10px}
.jseg{grid-auto-columns:auto;overflow-x:auto;scrollbar-width:none}.jseg button{white-space:nowrap;padding:8px 9px}
.qline{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}.qline:first-child{border-top:0;padding-top:0}
.qlrow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end}
.qvar{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}
.qopt input{margin-top:3px;width:20px;height:20px;flex:none}
/* add button: a round + on the right, well clear of the Ask AI button */
.fab{width:60px;height:60px;padding:0;border-radius:50%;justify-content:center;gap:0;font-size:32px;line-height:1;right:max(18px,calc(50% - 262px));bottom:calc(108px + env(safe-area-inset-bottom,0px))}
.fab .fab-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fab:active{transform:scale(.94)}
.row.row-hl{box-shadow:0 0 0 2px var(--gold) inset;background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
.row.row-flash{animation:rowflash 1.5s ease-out}
@keyframes rowflash{0%{background:color-mix(in srgb,var(--gold) 38%,var(--surface))}100%{background:color-mix(in srgb,var(--gold) 9%,var(--surface))}}
.invfacts{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:8px;margin:10px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.invfacts span{display:flex;flex-direction:column;min-width:0}.invfacts small{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.invfacts b{font-size:14.5px;white-space:nowrap}
.today-more{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:8px 0 2px;padding:9px 12px;border:1px dashed var(--line);border-radius:999px;background:transparent;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}

.ctrow input[type=checkbox]{width:22px;height:22px;flex:none;margin-right:4px}

.qhero small{display:block;font-size:13px;opacity:.85;margin-top:2px}

.moregrid .more-x{display:none}.moregrid .more-x.show{display:flex}
.linkbtn{border:0;background:none;color:var(--gold-ink);font-weight:700;text-decoration:underline;padding:0;cursor:pointer;font:inherit;font-weight:700}

"use strict";

// owner devices: app key + this business's owner secret; people you share with: their own code

/* ================= data (stored on this phone) ================= */

function gpBusiness() { return { ...clone(BIZDEF), id: "b1", name: "Golden Product", tagline: "Fresh milk · no milk powder · no additives · locally made", prefix: "GP-", products: clone(GP_PRODUCTS) }; }

}
const S = { staffTab: "roster", week: null, remTab: "customers", view: "invoices", filter: "all", sd: null, sdDirty: false, sheet: null, draft: null, data: null, busy: false, bd: null, rep: { tab: "sales", period: "thisMonth", basis: "invoice", from: "", to: "" } };

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const money = n => new Intl.NumberFormat("en-AU", { style: "currency", currency: "AUD" }).format(Number(n) || 0);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const pad = n => String(n).padStart(4, "0");
const clone = o => JSON.parse(JSON.stringify(o));
const p2 = n => String(n).padStart(2, "0");
function todayStr(d = new Date()) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function addDays(s, n) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + Number(n || 0)); return todayStr(d); }
function niceDate(s) { if (!s) return ""; return new Date(s + "T00:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" }); }

const D = () => S.data;
const settings = () => S.data.settings;

function inkOn(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "#1B2230"; const n = parseInt(m[1], 16), l = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; return l < 0.55 ? "#FFFFFF" : "#1B2230"; }

function load() {

}
function normalise(d) {
  const raw = d.settings || {};
  let biz = Array.isArray(raw.businesses) && raw.businesses.length ? raw.businesses : null;

/* ================= invoice maths ================= */

async function syncBroadcasts() {
  const waiting = [];
  D().broadcasts.forEach(b => (b.recipients || []).forEach(x => { if (x.status === "scheduled") waiting.push(x); }));
  if (!waiting.length) return;
  const res = await nat("status", { ids: waiting.map(x => x.id) });
  if (!res || !res.ok || !res.sms) return;
  let changed = false;
  waiting.forEach(x => { const s = res.sms[x.id]; if (s && s.status && s.status !== "scheduled") { x.status = s.status; if (s.error) x.error = s.error; changed = true; } });
  D().broadcasts.forEach(b => { if (b.status === "scheduled" && !(b.recipients || []).some(x => x.status === "scheduled")) { b.status = "done"; changed = true; } });
  if (changed) { persist(); renderMain(); }
}
async function syncStatuses() {

  const res = await nat("status", { ids: pend.filter(r => r.viaText).map(r => r.id), emailIds: hasLink() ? pend.filter(r => r.viaEmail).map(r => r.id) : [], link: link() });
  if (!res || !res.ok) return;
  let changed = false;
  for (const r of pend) {
    const n = { ...r };
    const sm = res.sms && res.sms[r.id], em = res.email && res.email[r.id];
    if (r.viaText && sm && sm.status && sm.status !== n.textStatus) { n.textStatus = sm.status; if (sm.error) n.error = sm.error; }
    if (r.viaEmail && em && em.status && em.status !== n.emailStatus) { n.emailStatus = em.status; if (em.error) n.error = em.error; }
    const parts = [r.viaText ? n.textStatus : null, r.viaEmail ? n.emailStatus : null].filter(Boolean);
    if (parts.length && parts.every(x => x !== "scheduled")) n.status = parts.some(x => x === "failed") ? "failed" : "sent";
    if (JSON.stringify(n) !== JSON.stringify(r)) {
      Object.assign(r, n); changed = true;

    }
  }
  if (changed) { persist(); renderMain(); }
}

/* ---- reports ---- */
function monthStart(d) { return todayStr(new Date(d.getFullYear(), d.getMonth(), 1)); }
function monthEnd(d) { return todayStr(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
function periodRange(p) {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  const q = Math.floor(m / 3) * 3, fy = m >= 6 ? y : y - 1;
  switch (p) {
    case "thisMonth": return [monthStart(n), monthEnd(n), "This month"];
    case "lastMonth": { const d = new Date(y, m - 1, 1); return [monthStart(d), monthEnd(d), "Last month"]; }
    case "thisQ": return [todayStr(new Date(y, q, 1)), todayStr(new Date(y, q + 3, 0)), "This quarter"];
    case "lastQ": return [todayStr(new Date(y, q - 3, 1)), todayStr(new Date(y, q, 0)), "Last quarter"];
    case "thisFY": return [fy + "-07-01", (fy + 1) + "-06-30", "FY " + fy + "–" + String(fy + 1).slice(2)];
    case "lastFY": return [(fy - 1) + "-07-01", fy + "-06-30", "FY " + (fy - 1) + "–" + String(fy).slice(2)];
    case "all": return ["0000-01-01", "9999-12-31", "All time"];
    default: return [S.rep.from || monthStart(n), S.rep.to || todayStr(), "Custom"];
  }
}

    const d = S.rep.basis === "paid" ? (i.status === "paid" ? (i.paidAt || "").slice(0, 10) : "") : i.date;

}
function repStats(list) {

/* ---- customers ---- */
function openCustomer(c) {
  const d = c ? clone(c) : { id: null, name: "", phone: "", email: "", address: "", note: "" };
  d.groupsText = (d.groups || []).join(", ");
  S.draft = d;
  const invs = c ? D().invoices.filter(i => i.customerId === c.id) : [];
  const f = (k, l, t, ph) => '<div class="field"><label for="c_' + k + '">' + l + '</label><input id="c_' + k + '" data-c="' + k + '" type="' + (t || "text") + '" value="' + esc(d[k]) + '"' + (ph ? ' placeholder="' + ph + '"' : "") + "></div>";
  const known = allGroups();
  const body = '<div class="card stack">' + f("name", "Name", "text", "Business or person") + '<div class="grid2">' + f("phone", "Mobile phone", "tel", "04xx xxx xxx") + f("email", "Email", "email") + "</div>" + '<p class="hint">Invoices and reminders are sent to this mobile (text) and email automatically.</p>' + f("address", "Address") + '<div class="field"><label for="c_note">Private note (not on invoices)</label><textarea id="c_note" data-c="note" placeholder="Delivery days, usual order…">' + esc(d.note) + "</textarea></div></div>" +
    '<div class="card stack">' + f("groupsText", "Groups (for group messages)", "text", "e.g. Cafés, Weekly orders") +
    (known.length ? '<div class="chips">' + known.map(g => '<button class="chip" type="button" data-addgroup="' + esc(g) + '">＋ ' + esc(g) + "</button>").join("") + "</div>" : '<p class="hint">Separate groups with commas.</p>') +
    '<label class="toggle"><input type="checkbox" data-c="optOut"' + (d.optOut ? " checked" : "") + "> Opted out of specials and group messages</label></div>" +
    (c ? '<button class="btn pri" type="button" data-act="invForCust">＋ New invoice for ' + esc(c.name) + "</button>" + custPatternHtml(c) + (invs.length ? '<div class="sec" style="margin:4px 2px 0"><h2>Invoices</h2></div><div class="list">' + invs.map(invRow).join("") + "</div>" : "") : "");
  openSheet("cust", c ? c.name : "New customer", body, (c ? '<button class="btn danger" type="button" data-act="delCustomer">Delete</button>' : '<button class="btn" type="button" data-act="close">Cancel</button>') + '<button class="btn pri" type="button" data-act="saveCustomer">Save</button>');
}

/* ABA (Cemtex) direct entry file: upload to CommBiz or other business banking to pay everyone at once. */
function abaFile(biz, items, ds) {
  const clean = s => String(s || "").toUpperCase().replace(/[^A-Z0-9 &.\-\/'+]/g, " ");
  const L = (s, n) => clean(s).slice(0, n).padEnd(n, " "), R = (s, n, c) => String(s).slice(-n).padStart(n, c || " ");
  const bsb = s => { const d = String(s || "").replace(/\D/g, ""); return d.slice(0, 3) + "-" + d.slice(3, 6); };
  const acc = s => R(String(s || "").replace(/\D/g, ""), 9);
  const [y, m, d] = ds.split("-"), date = d + m + y.slice(2);
  const user = biz.aba.user || biz.bank.accountName || biz.name;
  const lines = ["0" + " ".repeat(17) + "01" + L(biz.aba.abbr || "CBA", 3) + " ".repeat(7) + L(user, 26) + R(String(biz.aba.apca || "").replace(/\D/g, ""), 6, "0") + L("WAGES", 12) + date + " ".repeat(40)];
  let total = 0;
  items.forEach(it => { total += it.cents; lines.push("1" + bsb(it.bsb) + acc(it.acc) + " " + "53" + R(it.cents, 10, "0") + L(it.name, 32) + L(it.ref, 18) + bsb(biz.bank.bsb) + acc(biz.bank.accountNumber) + L(user, 16) + "00000000"); });
  lines.push("7" + "999-999" + " ".repeat(12) + R(total, 10, "0") + R(total, 10, "0") + R(0, 10, "0") + " ".repeat(24) + R(items.length, 6, "0") + " ".repeat(40));
  if (lines.some(l => l.length !== 120)) throw new Error("ABA line length");
  return lines.join("\r\n") + "\r\n";
}
async function abaForWeek(wk) {
  const lines = payLines().filter(l => l.week === wk && !l.paid && l.net > 0);

  const skipped = [];
  lines.forEach(l => { const w = staffOf(l.staffId); if (!/^\d{6}$/.test(String(w.bsb || "").replace(/\D/g, "")) || !/^\d{4,9}$/.test(String(w.acc || "").replace(/\D/g, ""))) { skipped.push(w.name); return; } (byBiz[w.bizId] = byBiz[w.bizId] || []).push({ l, w }); });
  const bizIds = Object.keys(byBiz);
  if (!bizIds.length) return toast("Add bank details (BSB and account) to your workers first." + (skipped.length ? " Missing: " + skipped.join(", ") : ""), true);
  for (const id of bizIds) {
    const b = bizById(id);
    if (!/^\d{6}$/.test(String(b.bank.bsb || "").replace(/\D/g, "")) || !String(b.bank.accountNumber || "").replace(/\D/g, "")) { toast(b.name + ": add your BSB and account number in My shop → " + b.name + ".", true); continue; }
    if (!/^\d{1,6}$/.test(String(b.aba.apca || "").replace(/\D/g, ""))) { toast(b.name + ": add your bank's Direct Entry User ID in My shop → " + b.name + " → Bank details. CommBank gives this when you set up bulk payments in CommBiz.", true); continue; }
    const ref = (b.prefix || "").replace(/[^A-Z0-9]/gi, "").slice(0, 4) + " WAGES " + wk.slice(8, 10) + wk.slice(5, 7);
    const content = abaFile(b, byBiz[id].map(({ l, w }) => ({ bsb: w.bsb, acc: w.acc, name: w.accName || w.name, cents: Math.round(l.net * 100), ref })), todayStr());
    const name = (b.name + " wages " + wk).replace(/[^\w\- ]+/g, "") + ".aba";
    if (NATIVE) { const r = await nat("shareFile", { filename: name, content, mime: "text/plain", subject: name }); if (!r.ok) toast(r.error || "Couldn't share", true); }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], { type: "text/plain" })); a.download = name; a.click(); }
    S.lastAba = { wk, staff: byBiz[id].map(x => x.l.staffId) };
  }
  if (skipped.length) toast("Not in the file (no bank details): " + skipped.join(", "), true);
  else toast("Upload the file in CommBiz → Payments → Import file, check it and approve. Then tap Mark all paid.");
}

const CAT_GUESS = [["ingredients", /milk|cream|sugar|saffron|flour|yoghurt|yogurt|mint|salt|fruit|nuts?|butter|egg|spice|cocoa|vanilla|honey|syrup|ingredient|produce/i], ["packaging", /bottle|cup|lid|label|bag|packag|container|tub|straw|carton|box/i], ["power", /agl|origin|energy|electric|gas/i], ["water", /water|urban utilities/i], ["rent", /rent|lease/i], ["insurance", /insur/i], ["phone", /telstra|optus|vodafone|tpg|internet|mobile plan/i], ["pest", /pest/i], ["cleaning", /clean|chemical|sanitis|detergent/i], ["fuel", /fuel|unleaded|diesel|bp |shell|ampol|caltex/i], ["marketing", /facebook|meta|google ads|advert|flyer|marketing/i], ["repairs", /repair|service call|maintenance|technician/i], ["equipment", /fridge|freezer|machine|equipment|blender/i], ["accounting", /account|xero|myob|bookkeep/i], ["fees", /fee|subscription|merchant/i]];

function parseSupplierInvoice(text) {
  const lines = String(text || "").split(/\n/).map(l => l.trim()).filter(Boolean);
  const o = { supplier: "", date: "", total: 0, gst: null, items: [], abn: "", invNo: "" };
  const abn = text.match(/A\.?B\.?N\.?[:\s#]*((?:\d\s?){11})/i); if (abn) o.abn = abn[1].replace(/\s/g, "");
  const invM = String(text).match(/\b(?:invoice|inv)\.?\s*(?:no\.?|number|num|#)\s*[:#]?\s*([A-Z0-9][A-Z0-9\/-]*\d[A-Z0-9\/-]*)/i) || String(text).match(/\binvoice\s*[:#]\s*([A-Z0-9-]*\d[A-Z0-9-]*)/i);

  o.supplier = (lines.find(l => !skip.test(l) && /[a-z]{3}/i.test(l) && !/^\d/.test(l) && l.length <= 50 && !moneyIn(l).length) || "").replace(/\s{2,}.*/, "");
  for (const l of lines) { const parts = l.split(/\s{2,}|\s(?=\d)/); for (const p of [l, ...parts]) { const d = parseDate(p.replace(/^(date|invoice date|issued)[:\s]*/i, "")); if (d) { o.date = d; break; } } if (o.date) break; const m = l.match(/(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}|\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}|\d{4}-\d{2}-\d{2})/); if (m) { const d = parseDate(m[1]); if (d) { o.date = d; break; } } }
  const totLines = lines.filter(l => /(total|amount due|balance due|amount payable|grand total|to pay)/i.test(l) && !/sub\s*-?total|total gst|gst total/i.test(l));
  const totVals = totLines.map(l => moneyIn(l)).flat().filter(n => n > 0);
  const allVals = lines.map(l => moneyIn(l)).flat().filter(n => n > 0 && n < 100000);
  o.total = totVals.length ? Math.max(...totVals) : allVals.length ? Math.max(...allVals) : 0;
  const gstLine = lines.find(l => /\bgst\b|\btax\b/i.test(l) && !/incl|inc\.|includes/i.test(l.replace(/total.*$/i, "")) && moneyIn(l).length) || lines.find(l => /\bgst\b/i.test(l) && moneyIn(l).length);
  if (gstLine) { const all = moneyIn(gstLine), v = all.filter(n => n > 0 && n <= o.total / 10.4 + 0.05); if (v.length) o.gst = Math.max(...v); else if (all.some(n => n === 0)) o.gst = 0; }

function csvTable(text) {
  const rows = parseCSV(text).filter(r => r.some(c => String(c).trim()));
  if (rows.length < 2) return null;
  const head = rows[0].map(h => String(h).toLowerCase().trim());
  const col = (...names) => head.findIndex(h => names.some(n => h === n || h.includes(n)));
  return { rows: rows.slice(1), col };
}

  const t = csvTable(text); if (!t) return { ok: false, error: "The file has no rows under the column names." };

  if (ci.name < 0) return { ok: false, error: "Couldn't find a “name” column." };
  const digits = v => String(v || "").replace(/\D/g, "");
  let added = 0, skipped = 0;
  t.rows.forEach(r => {
    const g = k => ci[k] >= 0 ? String(r[ci[k]] || "").trim() : "";

    const ph = digits(g("phone"));
    if (D().customers.some(c => c.name.toLowerCase() === name.toLowerCase() || (ph && digits(c.phone) === ph))) { skipped++; return; }
    D().customers.push({ id: "c" + uid(), name, phone: g("phone"), email: g("email"), address: g("address"), note: g("note"), groups: g("group") ? g("group").split(/[;,]/).map(x => x.trim()).filter(Boolean) : [], createdAt: new Date().toISOString() });
    added++;

  sortAll(); persist();
  return { ok: true, added, skipped };
}

  if (ci.name < 0) return { ok: false, error: "Couldn't find a “name” column." };
  let added = 0, updated = 0;

    const price = parseAmt(g("price")), gst = /^(y|yes|true|1|gst|10)/i.test(g("gst")), stock = g("stock") === "" ? null : Number(g("stock").replace(/[^\d.-]/g, ""));

/* ================= one-tap repeat orders (from buying patterns) ================= */
function usualKey(p) { return (p.custId || "n:" + String(p.cust).toLowerCase()) + "|" + p.bizId + "|" + String(p.name).toLowerCase(); }
function custBizKey(p) { return (p.custId || "n:" + String(p.cust).toLowerCase()) + "|" + p.bizId; }
function dueOrders(days) {
  const t = todayStr(), until = addDays(t, days == null ? 1 : days), by = {}, skips = D().repeatSkip || {};
  buyPatterns().forEach(p => {
    if (p.stopped) return;
    const nx = nextExpected(p); if (!nx || nx > until) return;
    const ck = custBizKey(p);
    if (skips[ck] && skips[ck] >= t) return;
    const from = addDays(nx, -Math.max(1, Math.ceil(p.every / 2)));
    if (D().invoices.some(i => !i.sample && i.bizId === p.bizId && (p.custId ? i.customerId === p.custId : custOf(i).name === p.cust) && i.date > p.last && i.date >= from)) return;
    const o = by[ck] || (by[ck] = { ck, custId: p.custId, cust: p.cust, bizId: p.bizId, date: nx, every: p.every, weekday: p.weekday, items: [] });
    if (nx < o.date) o.date = nx;
    o.items.push(p);
  });
  return Object.values(by).sort((a, b) => a.date.localeCompare(b.date) || a.cust.localeCompare(b.cust));
}
function dueWhen(d) { const t = todayStr(); return d <= t ? "today" : d === addDays(t, 1) ? "tomorrow" : dayName(d); }

/* ================= supplier price watch ================= */
function expItems(e) {
  if (Array.isArray(e.items) && e.items.length) return e.items.map(i => ({ name: String(i.name || "").trim(), qty: Number(i.qty) || 1, amount: Number(i.amount) || 0 })).filter(i => i.name && i.amount > 0);
  const out = [];
  String(e.desc || "").replace(/^Invoice [^:]*:\s*/, "").split(";").forEach(part => { const m = part.trim().match(/^(.+?)(?:\s+×\s?(\d+(?:\.\d+)?))?\s+\$?([\d,]+\.\d{2})$/); if (m) out.push({ name: m[1].trim(), qty: Number(m[2]) || 1, amount: Number(m[3].replace(/,/g, "")) }); });
  return out;
}
function itemKey(n) { return normTxt(n).split(" ").filter(t => t.length > 1 && !/^\d+$/.test(t)).join(" "); }
function priceHistory(bizId) {
  const H = {};
  D().expenses.filter(e => !bizId || e.bizId === bizId).slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(e => {
    expItems(e).forEach(i => { const k = (e.supplier || "").toLowerCase().trim() + "|" + itemKey(i.name); if (!itemKey(i.name)) return; (H[k] = H[k] || { supplier: e.supplier || "", name: i.name, bizId: e.bizId, pts: [] }).pts.push({ date: e.date, unit: r2(i.amount / (i.qty || 1)), qty: i.qty, expId: e.id }); });
  });
  return Object.values(H);
}
function recipeMatches(itemName, b) {
  const it = itemKey(itemName).split(" ").filter(w => w.length > 2);
  const out = [];
  b.products.forEach((p, pi) => (p.recipe || []).forEach((l, li) => { const rw = itemKey(l.name).split(" ").filter(w => w.length > 2); if (rw.length && rw.every(w => it.some(t => tokMatch(t, w)))) out.push({ p, pi, l, li }); }));
  return out;
}
function priceChanges(bizId, days) {
  const since = addDays(todayStr(), -(days || 60)), out = [], seen = D().priceSeen || {};
  priceHistory(bizId).forEach(h => {
    if (h.pts.length < 2) return;
    const last = h.pts[h.pts.length - 1], prev = h.pts.slice(0, -1).reverse().find(x => x.date < last.date || x.expId !== last.expId); if (!prev || !(prev.unit > 0)) return;
    const pct = Math.round((last.unit - prev.unit) / prev.unit * 1000) / 10;
    if (Math.abs(pct) < 5 || last.date < since) return;
    const b = bizById(h.bizId), affected = recipeMatches(h.name, b);
    out.push({ key: h.supplier.toLowerCase() + "|" + itemKey(h.name), supplier: h.supplier, name: h.name, bizId: h.bizId, prev, last, pct, affected, seen: seen[h.supplier.toLowerCase() + "|" + itemKey(h.name)] === last.expId });
  });
  return out.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
}
function priceWatchHtml(bizId) {
  const ch = priceChanges(bizId); if (!ch.length) return "";
  return '<div class="card stack pw"><h3>Supplier price changes</h3>' + ch.map(c => {
    const b = bizById(c.bizId), ov = overheadRate(b);
    const aff = c.affected.map(a => { const cur = productCost(a.p, b, ov); const sim = clone(a.p); sim.recipe[a.li].price = r2((Number(a.l.price) || 0) * c.last.unit / c.prev.unit); const nw = productCost(sim, b, ov); return { a, cur, nw }; });
    return '<div class="pw-i"><div class="pp-h"><b>' + esc(c.name) + '</b><b class="num" style="color:' + (c.pct > 0 ? "var(--bad)" : "var(--ok)") + '">' + (c.pct > 0 ? "▲ +" : "▼ ") + c.pct + "%</b></div>" +
      '<div class="hint">' + esc(c.supplier || "Supplier") + ": " + money(c.prev.unit) + " (" + esc(niceDate(c.prev.date).replace(/ \d{4}$/, "")) + ") → <b>" + money(c.last.unit) + "</b> (" + esc(niceDate(c.last.date).replace(/ \d{4}$/, "")) + ") each</div>" +
      (aff.length ? '<div class="pw-aff">' + aff.map(x => "<span><b>" + esc(x.a.p.name) + "</b>: cost " + (x.cur.cost != null ? money(x.cur.cost) + " → " + money(x.nw.cost) : money(x.cur.mat) + " → " + money(x.nw.mat) + " ingredients") + (x.nw.profit != null ? ", profit " + money(x.nw.profit) + " each" : "") + (x.nw.suggest ? " · suggested price " + money(b.gstRegistered && x.a.p.gst && b.gstMode !== "ex" ? x.nw.suggest * (1 + (Number(b.gstRate) || 10) / 100) : x.nw.suggest) : "") + "</span>").join("") + '</div><button class="btn sm" type="button" data-pwupd="' + esc(c.key) + '">Update my recipe costs</button>' : '<p class="hint">Not in any product recipe yet. Add it to a recipe in Profit &amp; costs to see the effect on your prices.</p>') + "</div>";

}
function applyPriceChange(key) {
  const c = priceChanges(null, 400).find(x => x.key === key); if (!c) return 0;
  const b = bizById(c.bizId); let n = 0;
  c.affected.forEach(a => { const l = b.products[a.pi].recipe[a.li]; l.price = r2((Number(l.price) || 0) * c.last.unit / c.prev.unit); n++; });
  (D().priceSeen || (D().priceSeen = {}))[key] = c.last.expId; persist(); return n;

document.addEventListener("click", e => { const t = e.target.closest("[data-pwupd]"); if (!t) return; const n = applyPriceChange(t.dataset.pwupd); toast(n ? "Updated " + n + " recipe line" + (n === 1 ? "" : "s") + ". Product costs now use the new price." : "Nothing to update"); renderMain(); });

/* ================= roster into calendars (.ics) ================= */
function icsDate(dateStr, hm) { const d = new Date(dateStr + "T" + (hm || "00:00") + ":00"); return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }

    L.push("BEGIN:VEVENT", "UID:shift-" + sh.id + "@shopmate-ai", "DTSTAMP:" + stamp, "DTSTART:" + icsDate(sh.date, sh.start), "DTEND:" + icsDate(endDate, sh.end),
      "SUMMARY:" + icsEsc(title || "Shift at " + (b.name || "work")), "DESCRIPTION:" + icsEsc(w.name + ", " + niceTime(sh.start) + "–" + niceTime(sh.end) + (Number(sh.breakMin) ? ", " + sh.breakMin + " min break" : "") + " (" + shiftHours(sh) + " h)" + (sh.note ? "\n" + sh.note : "")));

function shiftsIcs(w, list) { return icsWrap((bizById(w.bizId).name || "Work") + " shifts", shiftEvents(w, list)); }
async function sendCalendar(staffId, mine) {
  const wk = S.week || mondayOf(todayStr()), ws = staffId ? [staffOf(staffId)] : staffInView();

    const ics = icsWrap("Staff roster", files.flatMap(x => shiftEvents(x.w, x.list, x.w.name.split(" ")[0] + " on shift")));
    const r = await nat("openFile", { filename: "Roster " + wk + ".ics", content: ics, mime: "text/calendar" }); if (!r.ok) toast(r.error || "Couldn't open your calendar", true); return;

async function impReadOne(i, b, sys) {

  const u = await nat("useImport", { i });

    let a, tries = 0;

      const limit = /limit/i.test(a.error || ""), busy = IMP_BUSY.test(a.error || "");

      const secs = limit ? 30 : 10 * tries; S.imp.waitWhy = limit ? "limit" : "busy";

  });
}

    const full = p.innerHTML, txt = p.textContent.trim(); if (txt.length < 120) return;

}
